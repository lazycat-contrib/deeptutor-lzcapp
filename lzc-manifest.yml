application:
  subdomain: deeptutor
  upstreams:
    # DeepTutor 前端 (Next.js) - 主入口
    - location: /
      backend: http://deeptutor:3782/
    # DeepTutor 后端 API - 根据实际 API 路径调整
    - location: /api
      backend: http://deeptutor:8001/
  public_path:
    - /
services:
  deeptutor:
    # ghcr.io/hkuds/deeptutor:1.5.15
    # upstream: ghcr.io/hkuds/deeptutor:1.5.16
    image: ghcr.1ms.run/hkuds/deeptutor:1.5.16
    environment:
      # 后端 API 端口
      - DEEPTUTOR_DOCKER_BACKEND_PORT=8001
      # 前端端口
      - DEEPTUTOR_DOCKER_FRONTEND_PORT=3782
    binds:
      # 持久化工作区、记忆库、知识库、系统认证等数据
      - /lzcapp/var/data:/app/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8001/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
usage: |-
  DeepTutor - 智能体原生个性化辅导工作空间

  1. 打开应用后，在设置中配置 LLM 供应商（支持 LM Studio / Ollama / vLLM 等）
  2. 开始使用辅导、问题解决、测验生成等功能

  注意：如需配置 API 地址，请访问应用设置页面中的
  "next_public_api_base_external" 选项
